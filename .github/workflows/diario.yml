# ============================================================
# SENAMHI diario
#
# 1. Scrapea el aviso vigente y descarga los shapefiles
# 2. Publica en Earth Engine:
#      <ASSET_ROOT>/avisos_pp_img   ImageCollection (raster Peru, banda nivel)
#      <ASSET_ROOT>/avisos_pp_fc    FeatureCollection historica
# 3. Commitea los endpoints estaticos en api/ (JSON + GeoJSON)
#
# HORARIO: el cron usa hora UTC. Peru = UTC-5 todo el anio.
#   '30 17 * * *'  =  12:30 pm en Lima
#   Ejemplos: '0 13 * * *' = 08:00 Lima | '0 18 * * *' = 13:00 Lima
#
# SECRETS (repo -> Settings -> Secrets and variables -> Actions):
#   GEE_SA_JSON  : contenido completo del JSON de la cuenta de servicio
#   GEE_PROJECT  : id del proyecto Cloud (ej: ee-tuusuario)
#   ASSET_ROOT   : carpeta destino, ej: projects/ee-tuusuario/assets/senamhi
#
# El commit diario de api/ mantiene vivo el cron (GitHub desactiva los
# schedules tras ~60 dias sin actividad en el repo).
# ============================================================

name: SENAMHI diario

on:
  schedule:
    - cron: '30 17 * * *'   # 12:30 hora Peru (17:30 UTC)
  workflow_dispatch: {}

permissions:
  contents: write   # necesario para commitear api/

concurrency:
  group: senamhi-diario
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pipeline SENAMHI -> Earth Engine + api/
        env:
          GEE_SA_JSON: ${{ secrets.GEE_SA_JSON }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          ASSET_ROOT: ${{ secrets.ASSET_ROOT }}
          N_AVISOS: '5'
          RASTER_SCALE: '1000'
        run: python senamhi_avisos.py

      - name: Publicar endpoints estaticos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api
          if git diff --staged --quiet; then
            echo "Sin cambios en api/"
          else
            git commit -m "data: avisos SENAMHI $(date -u +%F)"
            git push
          fi

      - name: Guardar shapefiles crudos como artefacto (30 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shapefiles-${{ github.run_number }}
          path: salidas/
          retention-days: 30
          if-no-files-found: warn
